<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juntada · Diagnóstico V1.16</title><style>body{font:16px system-ui;background:#fff5e8;color:#173b61;margin:0;padding:20px;max-width:700px}h1{font-size:24px}li{margin:12px 0;padding:12px;background:white;border-radius:12px}small{display:block;color:#52657a}button{padding:12px 16px;background:#24518b;color:white;border:0;border-radius:10px;font-weight:bold}</style><h1>Diagnóstico Juntada V1.16</h1><p>Verifica desde tu navegador si GitHub Pages está sirviendo la vista previa y la fotografía. No crea ni modifica juntadas.</p><button onclick="run()">Volver a comprobar</button><ol id="results"><li>Comprobando...</li></ol><script>async function run(){const out=document.getElementById('results');out.innerHTML='';function add(label,ok,detail){const li=document.createElement('li');li.textContent=(ok?'✓ ':'✗ ')+label;const s=document.createElement('small');s.textContent=detail;li.appendChild(s);out.appendChild(li)}try{const r=await fetch('./preview-v116.html?qa='+Date.now(),{cache:'no-store'});const html=await r.text();add('Vista previa accesible',r.ok&&html.includes('id="create"'),'HTTP '+r.status);add('Portada enlazada',html.includes("url('./juntada_create_cover_v115.jpg')"),'Referencia en HTML');add('Flujos básicos presentes',html.includes('Votamos')&&html.includes('Fecha fija')&&html.includes('Yo invito'),'Presencia estática; no prueba interacciones')}catch(e){add('Vista previa accesible',false,String(e))}try{const img=new Image();img.onload=()=>add('Fotografía cargada',img.naturalWidth>=900,'Dimensiones: '+img.naturalWidth+' × '+img.naturalHeight+' px');img.onerror=()=>add('Fotografía cargada',false,'El navegador no pudo cargar el JPG');img.src='./juntada_create_cover_v115.jpg?qa='+Date.now()}catch(e){add('Fotografía cargada',false,String(e))}}run()<\/script></html>
