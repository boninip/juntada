name: Juntada V1.17.2 preview QA
on:
  push:
    paths:
      - 'preview-v1172.html'
      - 'tests/preview-regression-v1172.cjs'
      - 'tests/preview-functional-v1172.cjs'
      - '.github/workflows/preview-v1172.yml'
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: ln -s "$PWD" juntada
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/juntada-http.log 2>&1 &
      - run: node tests/preview-regression-v1172.cjs
      - run: node tests/preview-functional-v1172.cjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-v1172-screenshots
          path: |
            qa-preview-v1172-*.png
            qa-v1172-event-functional.png
          if-no-files-found: ignore
